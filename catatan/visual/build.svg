<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">Dari Cargo manifest ke server</title><desc id="desc">Cargo membaca manifest, membangun crate, membuat executable, lalu cargo run menjalankan aplikasi dengan konfigurasi dan database.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="320" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">DARI KODE MENJADI SERVER</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Cargo mengatur build; aplikasi yang memulai layanan</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="60" y="132" width="210" height="105" rx="18" fill="#202c3f"/><text x="165" y="172" font-size="18" font-weight="700" fill="#f3f6fc">Cargo.toml</text><text x="165" y="202" font-size="13" fill="#b2bfd2">daftar dependency</text><rect x="330" y="132" width="210" height="105" rx="18" fill="#202c3f"/><text x="435" y="172" font-size="18" font-weight="700" fill="#f3f6fc">cargo build</text><text x="435" y="202" font-size="13" fill="#b2bfd2">kompilasi kode</text><rect x="600" y="132" width="210" height="105" rx="18" fill="#202c3f"/><text x="705" y="172" font-size="18" font-weight="700" fill="#f3f6fc">cargo run</text><text x="705" y="202" font-size="13" fill="#b2bfd2">jalankan main.rs</text><rect x="870" y="132" width="210" height="105" rx="18" fill="#173d3a"/><text x="975" y="172" font-size="18" font-weight="700" fill="#77d7c6">API aktif</text><text x="975" y="202" font-size="13" fill="#afd0c8">localhost:8080</text><path d="M272 185h50m168 0h100m168 0h100" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/></g></svg>

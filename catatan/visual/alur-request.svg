<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Alur satu request API</title><desc id="desc">Request bergerak dari client ke Actix, diperiksa middleware, diolah handler, disimpan ke PostgreSQL, lalu response kembali ke client.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs>
<rect width="1120" height="350" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">PETA PERJALANAN REQUEST</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Dari client sampai data tersimpan</text>
<g font-family="sans-serif"><rect x="42" y="130" width="150" height="116" rx="18" fill="#202c3f"/><circle cx="76" cy="164" r="17" fill="#293955"/><text x="76" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#c9d7fb">1</text><text x="65" y="204" font-size="17" font-weight="700" fill="#f3f6fc">Client</text><text x="65" y="228" font-size="13" fill="#b2bfd2">kirim HTTP</text>
<rect x="230" y="130" width="150" height="116" rx="18" fill="#202c3f"/><circle cx="264" cy="164" r="17" fill="#293955"/><text x="264" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#c9d7fb">2</text><text x="253" y="204" font-size="17" font-weight="700" fill="#f3f6fc">Router</text><text x="253" y="228" font-size="13" fill="#b2bfd2">cocokkan URL</text>
<rect x="418" y="130" width="150" height="116" rx="18" fill="#3a2a1b"/><circle cx="452" cy="164" r="17" fill="#5a3c1c"/><text x="452" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#ffc37d">3</text><text x="441" y="204" font-size="17" font-weight="700" fill="#f3f6fc">Middleware</text><text x="441" y="228" font-size="13" fill="#dfbd96">cek session</text>
<rect x="606" y="130" width="150" height="116" rx="18" fill="#202c3f"/><circle cx="640" cy="164" r="17" fill="#173d3a"/><text x="640" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#77d7c6">4</text><text x="629" y="204" font-size="17" font-weight="700" fill="#f3f6fc">Handler</text><text x="629" y="228" font-size="13" fill="#b2bfd2">validasi + aturan</text>
<rect x="794" y="130" width="150" height="116" rx="18" fill="#202c3f"/><circle cx="828" cy="164" r="17" fill="#173d3a"/><text x="828" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#77d7c6">5</text><text x="817" y="204" font-size="17" font-weight="700" fill="#f3f6fc">SQLx + DB</text><text x="817" y="228" font-size="13" fill="#b2bfd2">baca / simpan</text>
<path d="M194 188h30m158 0h30m158 0h30m158 0h30" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/>
<path d="M870 258v37H120v-38" fill="none" stroke="#55c9b4" stroke-width="3" marker-end="url(#a)"/><text x="494" y="323" text-anchor="middle" font-size="14" font-family="sans-serif" font-weight="700" fill="#77d7c6">JSON response + status HTTP kembali ke client</text></g></svg>

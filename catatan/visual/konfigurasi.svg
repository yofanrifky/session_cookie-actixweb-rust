<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">Konfigurasi aplikasi</title><desc id="desc">File .env memberikan DATABASE_URL dan SESSION_KEY yang wajib serta HOST dan PORT yang memiliki nilai bawaan kepada proses aplikasi.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="300" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">KONFIGURASI SAAT STARTUP</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Nilai lokal masuk ke aplikasi dari environment</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="80" y="128" width="260" height="105" rx="18" fill="#202c3f"/><text x="210" y="166" font-size="18" font-weight="700" fill="#f3f6fc">File .env</text><text x="210" y="198" font-size="14" fill="#b2bfd2">URL DB · host · port · key</text><rect x="430" y="128" width="260" height="105" rx="18" fill="#173d3a"/><text x="560" y="166" font-size="18" font-weight="700" fill="#77d7c6">dotenvy + env::var</text><text x="560" y="198" font-size="14" fill="#afd0c8">baca dan validasi nilai</text><rect x="780" y="128" width="260" height="105" rx="18" fill="#3a2a1b"/><text x="910" y="166" font-size="18" font-weight="700" fill="#ffc37d">main.rs</text><text x="910" y="198" font-size="14" fill="#dfbd96">siapkan DB dan HTTP</text><path d="M345 180h75m275 0h75" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/></g><text x="560" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b2bfd2">DATABASE_URL + SESSION_KEY wajib · HOST + PORT punya default</text></svg>

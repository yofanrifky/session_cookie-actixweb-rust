<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Sampul panduan belajar backend restoran</title><desc id="desc">Sampul gelap berkontras tinggi menampilkan jalur belajar dari request ke response, tiga langkah belajar, dan node client, route, handler, database.</desc>
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172337"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54d6bd"/><stop offset="1" stop-color="#758bff"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#93a7c8"/></marker>
</defs>
<rect width="1200" height="520" rx="34" fill="url(#base)"/>
<circle cx="970" cy="180" r="170" fill="#296d69" opacity=".28" filter="url(#blur)"/><circle cx="1050" cy="360" r="140" fill="#424f9a" opacity=".28" filter="url(#blur)"/>
<path d="M0 420C220 340 330 545 570 435S900 340 1200 420" fill="none" stroke="#405171" stroke-width="1" opacity=".55"/>
<text x="68" y="75" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#75d9c5">PANDUAN BELAJAR · RUST + ACTIX + POSTGRESQL</text>
<text x="68" y="165" font-family="sans-serif" font-size="47" font-weight="800" fill="#f4f7ff">Backend restoran,</text><text x="68" y="222" font-family="sans-serif" font-size="47" font-weight="800" fill="#f4f7ff">dari request ke response.</text>
<text x="70" y="270" font-family="sans-serif" font-size="18" fill="#bdc9dc">Ikuti alurnya. Pahami kodenya. Coba sendiri.</text>

<circle cx="958" cy="245" r="67" fill="#173d3a" stroke="#55c9b4" stroke-width="2"/><text x="958" y="241" font-size="15" font-weight="700" fill="#c6f4ea">HANDLER</text><text x="958" y="264" font-size="12" fill="#afd0c8">validasi + aturan</text>
<circle cx="1060" cy="105" r="58" fill="#3a2a1b" stroke="#e9a763" stroke-width="2"/><text x="1060" y="101" font-size="14" font-weight="700" fill="#ffe0b5">ROUTE</text><text x="1060" y="123" font-size="11" fill="#dfbd96">pilih endpoint</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
<title id="title">Transformasi harga</title><desc id="desc">Harga disimpan sebagai Decimal dan diubah menjadi teks Rupiah hanya pada beberapa response GET menu.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="300" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">ANGKA → TAMPILAN</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Nilai tetap numerik sampai perlu ditampilkan</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="95" y="126" width="245" height="105" rx="18" fill="#202c3f"/><text x="217" y="166" font-size="18" font-weight="700" fill="#f3f6fc">Decimal</text><text x="217" y="199" font-size="16" fill="#b2bfd2">25000</text><rect x="438" y="126" width="245" height="105" rx="18" fill="#173d3a"/><text x="560" y="166" font-size="18" font-weight="700" fill="#77d7c6">format_rupiah()</text><text x="560" y="199" font-size="14" fill="#afd0c8">kelompok ribuan + koma</text><rect x="780" y="126" width="245" height="105" rx="18" fill="#3a2a1b"/><text x="902" y="166" font-size="18" font-weight="700" fill="#ffc37d">String</text><text x="902" y="199" font-size="16" fill="#dfbd96">Rp25.000</text><path d="M345 178h82m259 0h82" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/></g><text x="560" y="269" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b2bfd2">Formatter hanya mengubah jalur tampilan; data PostgreSQL tetap NUMERIC.</text></svg>

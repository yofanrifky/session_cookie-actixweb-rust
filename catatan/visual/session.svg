<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Siklus login dan session</title><desc id="desc">Pengguna register, login, menerima cookie, mengirim cookie pada route terlindungi, kemudian logout menghapus session.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="350" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">SIKLUS AUTENTIKASI</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Cookie membawa status login antar-request</text>
<g font-family="sans-serif"><rect x="45" y="130" width="190" height="105" rx="18" fill="#202c3f"/><text x="140" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#f3f6fc">1 · Daftar</text><text x="140" y="201" text-anchor="middle" font-size="13" fill="#b2bfd2">username + password</text>
<rect x="285" y="130" width="190" height="105" rx="18" fill="#202c3f"/><text x="380" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#f3f6fc">2 · Login</text><text x="380" y="201" text-anchor="middle" font-size="13" fill="#b2bfd2">server memeriksa akun</text>
<rect x="525" y="130" width="190" height="105" rx="18" fill="#173d3a"/><text x="620" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#77d7c6">3 · Cookie</text><text x="620" y="201" text-anchor="middle" font-size="13" fill="#afd0c8">session memuat user_id</text>
<rect x="765" y="130" width="190" height="105" rx="18" fill="#3a2a1b"/><text x="860" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffc37d">4 · Request</text><text x="860" y="201" text-anchor="middle" font-size="13" fill="#dfbd96">middleware cek cookie</text>
<path d="M238 182h40m198 0h40m198 0h40" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/>
<rect x="370" y="270" width="380" height="48" rx="16" fill="#304875"/><text x="560" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#202c3f">POST /api/auth/logout → session dihapus</text>
<path d="M860 238v55h-100" fill="none" stroke="#e9a763" stroke-width="2.5" marker-end="url(#a)"/></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">Peta route API restoran</title><desc id="desc">Prefix api bercabang menjadi autentikasi, menu, dan pesanan; register login logout terbuka, profil menu dan pesanan perlu login.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="360" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">PETA ENDPOINT</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Tiga kelompok route di bawah /api</text>
<g font-family="sans-serif"><rect x="60" y="132" width="180" height="96" rx="18" fill="#304875"/><text x="150" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#202c3f">/api</text><text x="150" y="201" text-anchor="middle" font-size="13" fill="#dce5fa">prefix bersama</text>
<rect x="365" y="118" width="300" height="94" rx="18" fill="#173d3a"/><text x="515" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#77d7c6">/auth</text><text x="515" y="183" text-anchor="middle" font-size="13" fill="#afd0c8">register · login · logout · me*</text>
<rect x="365" y="242" width="300" height="76" rx="18" fill="#202c3f"/><text x="515" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#f3f6fc">/menus</text><text x="515" y="297" text-anchor="middle" font-size="13" fill="#b2bfd2">GET · POST · PUT · PATCH · DELETE*</text>
<rect x="760" y="242" width="300" height="76" rx="18" fill="#202c3f"/><text x="910" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#f3f6fc">/orders</text><text x="910" y="297" text-anchor="middle" font-size="13" fill="#b2bfd2">GET · POST · PUT · PATCH · DELETE*</text>
<path d="M242 180h70v-15h45M312 180v100h45M665 280h85" fill="none" stroke="#8da2c2" stroke-width="2.5" marker-end="url(#a)"/></g><text x="515" y="224" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b2bfd2">* me, menus, dan orders meminta login</text><text x="560" y="343" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#b2bfd2">PUT mengganti semua field · PATCH mengganti field yang dikirim</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Peta arsitektur backend</title><desc id="desc">Main menyiapkan aplikasi, routes mengarah ke middleware dan handler, handler menggunakan models dan state, lalu state mengakses database.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="440" rx="28" fill="url(#bg)"/>
<text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">PETA FILE</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Setiap modul punya satu tanggung jawab</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="450" y="110" width="220" height="66" rx="16" fill="#304875"/><text x="560" y="139" font-size="18" font-weight="700" fill="#202c3f">main.rs</text><text x="560" y="160" font-size="13" fill="#dce5fa">merangkai dan menjalankan</text>
<rect x="110" y="222" width="220" height="72" rx="16" fill="#202c3f"/><text x="220" y="252" font-size="18" font-weight="700" fill="#f3f6fc">routes.rs</text><text x="220" y="275" font-size="13" fill="#b2bfd2">URL → handler</text>
<rect x="450" y="222" width="220" height="72" rx="16" fill="#3a2a1b"/><text x="560" y="252" font-size="18" font-weight="700" fill="#ffc37d">auth_middleware.rs</text><text x="560" y="275" font-size="13" fill="#dfbd96">periksa session</text>
<rect x="790" y="222" width="220" height="72" rx="16" fill="#173d3a"/><text x="900" y="252" font-size="18" font-weight="700" fill="#77d7c6">handlers/</text><text x="900" y="275" font-size="13" fill="#afd0c8">aturan tiap endpoint</text>
<rect x="110" y="350" width="220" height="58" rx="15" fill="#202c3f"/><text x="220" y="376" font-size="16" font-weight="700" fill="#f3f6fc">models.rs</text><text x="220" y="396" font-size="12" fill="#b2bfd2">bentuk data</text>
<rect x="450" y="350" width="220" height="58" rx="15" fill="#202c3f"/><text x="560" y="376" font-size="16" font-weight="700" fill="#f3f6fc">state.rs</text><text x="560" y="396" font-size="12" fill="#b2bfd2">pool koneksi</text>
<rect x="790" y="350" width="220" height="58" rx="15" fill="#304875"/><text x="900" y="376" font-size="16" font-weight="700" fill="#202c3f">PostgreSQL</text><text x="900" y="396" font-size="12" fill="#dce5fa">tabel dan data</text>

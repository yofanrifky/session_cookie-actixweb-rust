<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">Siklus CRUD pada handler</title><desc id="desc">Input request dibaca dan divalidasi, SQL dijalankan, hasilnya bercabang menjadi data ditemukan, data tidak ada, atau error; handler mengembalikan status dan JSON.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172337"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#8da2c2"/></marker></defs><rect width="1120" height="350" rx="28" fill="url(#bg)"/><text x="42" y="48" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#b2bfd2">POLA HANDLER</text><text x="42" y="82" font-family="sans-serif" font-size="25" font-weight="700" fill="#f3f6fc">Setiap operasi melewati empat tahap</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="55" y="130" width="210" height="98" rx="18" fill="#202c3f"/><text x="160" y="169" font-size="18" font-weight="700" fill="#f3f6fc">1 · Terima input</text><text x="160" y="200" font-size="13" fill="#b2bfd2">JSON / ID / query</text><rect x="325" y="130" width="210" height="98" rx="18" fill="#3a2a1b"/><text x="430" y="169" font-size="18" font-weight="700" fill="#ffc37d">2 · Validasi</text><text x="430" y="200" font-size="13" fill="#dfbd96">400 bila tidak sah</text><rect x="595" y="130" width="210" height="98" rx="18" fill="#173d3a"/><text x="700" y="169" font-size="18" font-weight="700" fill="#77d7c6">3 · Jalankan SQL</text><text x="700" y="200" font-size="13" fill="#afd0c8">bind → fetch / execute</text><rect x="865" y="130" width="210" height="98" rx="18" fill="#202c3f"/><text x="970" y="169" font-size="18" font-weight="700" fill="#f3f6fc">4 · Bentuk response</text><text x="970" y="200" font-size="13" fill="#b2bfd2">status + body JSON</text><path d="M268 179h51m218 0h51m218 0h51" stroke="#8da2c2" stroke-width="3" marker-end="url(#a)"/></g><text x="560" y="284" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#dce4f1">400 input salah</text><text x="560" y="314" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#b2bfd2">200/201 berhasil · 404 ID tidak ditemukan · 500 query gagal</text></svg>
